<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | MedPredict</title>
    <style>
        body { background: #2c3e50; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 10px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-card h2 { color: #e31c3d; margin-bottom: 20px; }
        .login-card p { color: #666; font-size: 14px; margin-bottom: 30px; }
        .input-field { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: #e31c3d; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .submit-btn:hover { background: #b8122d; }
        .flash-msg { color: #e31c3d; margin-top: 15px; font-weight: bold; font-size: 14px; }
        .back-link { display: block; margin-top: 20px; color: #2c3e50; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Portal</h2>
        <p>Restricted Access Only</p>
        
        <form action="{{ url_for('admin_login') }}" method="POST">
            <input type="email" name="email" class="input-field" placeholder="Admin Email" required>
            <input type="password" name="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="submit-btn">Login to Dashboard</button>
        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p class="flash-msg">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}

        <a href="/" class="back-link">&larr; Back to Home</a>
    </div>
</body>
</html>
