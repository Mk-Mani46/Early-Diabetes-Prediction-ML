<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | DiaPredict</title>
    <style>
        body { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)); background-size: cover; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        .form-box { width: 380px; height: 500px; background: #fff; padding: 5px; border-radius: 10px; overflow: hidden; position: relative; }
        .button-box { width: 220px; margin: 35px auto; position: relative; box-shadow: 0 0 20px 9px #ff61241f; border-radius: 30px; }
        .toggle-btn { padding: 10px 30px; cursor: pointer; background: transparent; border: 0; outline: none; position: relative; }
        #btn { top: 0; left: 0; position: absolute; width: 110px; height: 100%; background: #e31c3d; border-radius: 30px; transition: .5s; }
        .input-group { top: 150px; position: absolute; width: 280px; transition: .5s; }
        .input-field { width: 100%; padding: 10px 0; margin: 5px 0; border-left: 0; border-top: 0; border-right: 0; border-bottom: 1px solid #999; outline: none; background: transparent; }
        .submit-btn { width: 85%; padding: 10px 30px; cursor: pointer; display: block; margin: auto; background: #e31c3d; border: 0; outline: none; border-radius: 30px; color: #fff; margin-top: 30px; }
        #login { left: 50px; }
        #register { left: 450px; }
        .flash-msg { color: #e31c3d; text-align: center; margin-top: 350px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="form-box">
        <div class="button-box">
            <div id="btn"></div>
            <button type="button" class="toggle-btn" onclick="login()">Log In</button>
            <button type="button" class="toggle-btn" onclick="register()">Sign Up</button>
        </div>
        
        <form id="login" class="input-group" action="{{ url_for('login') }}" method="POST">
            <input type="email" name="email" class="input-field" placeholder="Email Id" required>
            <input type="password" name="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="submit-btn">Log In</button>
        </form>

        <form id="register" class="input-group" action="{{ url_for('register') }}" method="POST">
            <input type="text" name="fullname" class="input-field" placeholder="Full Name" required>
            <input type="email" name="email" class="input-field" placeholder="Email Id" required>
            <input type="text" name="phone" class="input-field" placeholder="Phone No" required>
            <input type="password" name="password" class="input-field" placeholder="Password" required>
            <input type="password" name="confirm_password" class="input-field" placeholder="Confirm Password" required>
            <button type="submit" class="submit-btn">Sign Up</button>
        </form>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p class="flash-msg">{{ messages[0] }}</p>
            {% endif %}
        {% endwith %}
    </div>
    
    <script>
        var x = document.getElementById("login");
        var y = document.getElementById("register");
        var z = document.getElementById("btn");
        function register() { x.style.left = "-400px"; y.style.left = "50px"; z.style.left = "110px"; }
        function login() { x.style.left = "50px"; y.style.left = "450px"; z.style.left = "0px"; }
    </script>
</body>
</html>
